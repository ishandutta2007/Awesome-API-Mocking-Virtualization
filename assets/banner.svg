<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <!-- Vibrant Gradient for Title & Highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.15)" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Animation Keyframes -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-20px) scale(1.08); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(25px) scale(0.95); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .floating-orb-1 {
        animation: floatSlow 8s ease-in-out infinite, pulseGlow 5s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatReverse 10s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      }
      .floating-orb-3 {
        animation: floatSlow 7s ease-in-out infinite reverse;
      }
      .data-stream {
        stroke-dasharray: 8 12;
        animation: flowData 2.5s linear infinite;
      }
      .mock-badge {
        animation: orbitCard 4s ease-in-out infinite;
      }
      .mock-badge-alt {
        animation: orbitCard 4.5s ease-in-out 1s infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="floating-orb-1" cx="200" cy="120" r="140" fill="#38bdf8" filter="url(#glowBlur)" />
  <circle class="floating-orb-2" cx="1020" cy="160" r="160" fill="#818cf8" filter="url(#glowBlur)" />
  <circle class="floating-orb-3" cx="620" cy="340" r="130" fill="#c084fc" filter="url(#glowBlur)" />

  <!-- Animated Data Flow Lines (API Request / Response Simulation) -->
  <path class="data-stream" d="M 50 80 Q 250 20 450 80 T 850 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" />
  <path class="data-stream" d="M 50 320 Q 300 370 600 320 T 1150 320" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4" />

  <!-- Dynamic Simulated Network Nodes & Pills (Accompanying periphery) -->
  <g class="mock-badge" transform="translate(80, 260)">
    <rect width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="24" cy="21" r="6" fill="#34d399" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">GET /api/v1/mock 200</text>
  </g>

  <g class="mock-badge-alt" transform="translate(940, 260)">
    <rect width="190" height="42" rx="21" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="24" cy="21" r="6" fill="#818cf8" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">POST /simulate 201</text>
  </g>

  <g class="mock-badge-alt" transform="translate(960, 60)">
    <rect width="160" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="80" y="23" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">⚡ ZERO LATENCY</text>
  </g>

  <g class="mock-badge" transform="translate(90, 60)">
    <rect width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="85" y="23" text-anchor="middle" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">✨ SHIFT-LEFT QA</text>
  </g>

  <!-- FOREGROUND: Clean, Sharp, Highly Legible Typography -->
  <g id="foregroundContent">
    <!-- Tagline Badge -->
    <g transform="translate(600, 110)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="url(#accentGrad)" stroke-width="1.5" />
      <text x="0" y="6" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="190" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      API MOCKING &amp; VIRTUALIZATION
    </text>

    <!-- Subtitle -->
    <text x="600" y="232" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      High-performance HTTP Mock Servers, Stubbing Tools, Service Emulators &amp; Enterprise Virtualization
    </text>

    <!-- Category Pills -->
    <g transform="translate(600, 310)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛠️ Open Source</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">☁️ SaaS Platforms</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Multi-Protocol</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(270, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 Market Insights</text>
      </g>
    </g>
  </g>
</svg>
